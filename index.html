<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RoboMasterChef - Beko ThermoExpert</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { 
            background: radial-gradient(circle at top left, #1f2937 0%, #111827 100%); 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.02); 
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s ease, border 0.2s ease;
        }
        .glass-card:hover { border: 1px solid rgba(0, 181, 226, 0.3); }
        .glass-card:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.05); }
        
        .beko-text { color: #00B5E2; }
        .beko-bg { background-color: #00B5E2; color: #ffffff; box-shadow: 0 4px 15px rgba(0, 181, 226, 0.35); }
        
        #recipe-detail { transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); transform: translateX(100%); }
        #recipe-detail.active { transform: translateX(0); }
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; }
        .list-view { display: flex; flex-direction: column; gap: 1.25rem; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden flex flex-col pb-safe">

    <!-- Üst Bar -->
    <header class="glass-panel z-10 flex flex-col pt-12 pb-4 px-5 shrink-0 rounded-b-3xl relative border-b border-white/5">
        <div class="flex justify-between items-center mb-1">
            <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2 text-white">
                <i class="ph-fill ph-cooking-pot beko-text text-3xl"></i> RoboMasterChef
            </h1>
        </div>
        <p class="text-sm text-gray-400 font-medium tracking-wide">ThermoExpert SMC 8491 Tarif Platformu</p>
    </header>

    <!-- Ana Ekran -->
    <main id="main-view" class="flex-1 overflow-y-auto p-5 hide-scrollbar relative">
        
        <!-- Beko Karşılama Bannerı -->
        <div class="mb-6 relative rounded-3xl overflow-hidden shadow-2xl glass-card h-48 flex items-center border border-white/10">
            <img src="https://images.unsplash.com/photo-1556910103-1c02745a8281?q=80&w=800&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-30 mix-blend-overlay">
            <div class="absolute inset-0 bg-gradient-to-r from-[#111827]/90 to-transparent"></div>
            <div class="relative z-10 p-6 w-full h-full flex flex-col justify-center">
                <div class="text-[10px] uppercase tracking-widest beko-text font-bold mb-1">Beko Akıllı Mutfak Robotu</div>
                <h2 class="text-2xl font-bold text-white mb-2 leading-tight">Lezzetin Ritmi<br>Değişti.</h2>
                <p class="text-xs text-gray-300 max-w-[60%]">ThermoExpert SMC 8491 ile kusursuz lezzetler.</p>
            </div>
        </div>

        <div class="mb-5 flex gap-3 sticky top-0 z-10 pt-2 bg-[#111827]/90 backdrop-blur-xl pb-3 -mx-5 px-5">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-xl"></i>
                <input type="text" id="search-input" placeholder="Tarif veya malzeme ara..." class="w-full glass-card rounded-2xl py-3.5 pl-12 pr-4 text-white text-base focus:outline-none focus:border-[#00B5E2]/50 placeholder-gray-500 transition-colors shadow-lg">
            </div>
            <button onclick="toggleView()" class="glass-card w-14 rounded-2xl flex items-center justify-center text-2xl shadow-lg hover:bg-white/5 transition-colors">
                <i id="view-icon" class="ph ph-squares-four text-gray-300"></i>
            </button>
        </div>

        <div id="category-filter" class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1 snap-x"></div>
        
        <div id="loading-indicator" class="text-center py-10 text-gray-400">
            <i class="ph ph-spinner animate-spin text-3xl beko-text mb-2"></i>
            <p class="text-sm font-medium">Tarifler Yükleniyor...</p>
        </div>

        <div id="recipe-container" class="grid-view pb-20 hidden"></div>
    </main>

    <!-- Tarif Detay Sayfası -->
    <div id="recipe-detail" class="fixed inset-0 bg-[#111827]/98 backdrop-blur-3xl z-50 flex flex-col h-full overflow-hidden">
        <div class="glass-panel pt-12 pb-4 px-4 flex items-center gap-4 shrink-0 rounded-b-3xl border-b border-white/5">
            <button onclick="closeRecipe()" class="glass-card p-2.5 rounded-full text-2xl hover:bg-white/10 transition-colors"><i class="ph ph-caret-left"></i></button>
            <h2 id="detail-title" class="text-xl font-bold flex-1 truncate tracking-tight text-white">Tarif Adı</h2>
        </div>
        <div class="flex-1 overflow-y-auto p-5 hide-scrollbar" id="detail-content"></div>
    </div>

    <script>
        const possibleCategories = [
            'data/turk_mutfagi.json', 'data/italyan_mutfagi.json', 'data/fransiz_mutfagi.json', 
            'data/asya_mutfagi.json', 'data/meksika_mutfagi.json', 'data/dunya_mutfagi.json', 
            'data/hamur_isleri.json', 'data/tatlilar.json', 'data/icecekler.json', 'data/smoothie.json',
            'data/corbalar.json', 'data/salatalar.json', 'data/et_yemekleri.json', 
            'data/zeytinyaglilar.json', 'data/saglikli_yasam.json', 'data/bebek_mamalari.json', 
            'data/soslar.json', 'data/seflerden_ozel.json', 'data/meze.json',
            'data/deniz_urunleri.json', 'data/vegan_tarifler.json', 'data/glutensiz.json',
            'data/kahvaltilik.json', 'data/pratik_tarifler.json', 'data/kislik_hazirliklar.json'
        ];

        let isGridView = true;
        let allRecipes = [];
        let activeCategory = 'Tümü';
        let searchQuery = '';

        const dictionary = { 
            "{{buhar_unitesi}}": "Buhar Sepeti", 
            "{{ic_sepet}}": "Pişirme Sepeti", 
            "{{ters_bicak}}": "Ters Dönüş", 
            "{{kasik_hizi}}": "Hız 1", 
            "{{cirpici}}": "Çırpma Aparatı", 
            "{{sote_bicagi}}": "Sote Bıçağı", 
            "{{olcu_kabi}}": "Ölçü Kapağı", 
            "{{spatula}}": "Spatula" 
        };

        const icons = { 
            "{{buhar_unitesi}}": "<i class='ph-fill ph-cloud-sun beko-text text-lg'></i>", 
            "{{ic_sepet}}": "<i class='ph-fill ph-shopping-cart-simple beko-text text-lg'></i>", 
            "{{ters_bicak}}": "<i class='ph-fill ph-arrow-u-down-left beko-text text-lg'></i>", 
            "{{kasik_hizi}}": "<i class='ph-fill ph-number-circle-one beko-text text-lg'></i>", 
            "{{cirpici}}": "<i class='ph-fill ph-tornado beko-text text-lg'></i>", 
            "{{sote_bicagi}}": "<i class='ph-fill ph-sword beko-text text-lg'></i>", 
            "{{olcu_kabi}}": "<i class='ph-fill ph-brandy beko-text text-lg'></i>", 
            "{{spatula}}": "<i class='ph-fill ph-paint-roller beko-text text-lg'></i>" 
        };

        async function loadRecipes() {
            allRecipes = [];
            const fetchPromises = possibleCategories.map(file => 
                fetch(file).then(res => res.ok ? res.json() : []).catch(() => [])
            );
            const results = await Promise.all(fetchPromises);
            results.forEach(data => { if(data.length > 0) allRecipes = allRecipes.concat(data); });
            
            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('recipe-container').classList.remove('hidden');
            extractCategories();
            applyFilters();
        }

        function extractCategories() {
            const uniqueCategories = ['Tümü', ...new Set(allRecipes.map(r => r.category))];
            const catContainer = document.getElementById('category-filter');
            catContainer.innerHTML = uniqueCategories.map(cat => {
                const isActive = cat === activeCategory;
                const activeStyle = "bg-[#00B5E2] text-white font-bold shadow-[0_4px_12px_rgba(0,181,226,0.4)] border border-[#00B5E2]";
                const inactiveStyle = "bg-white/5 text-gray-300 border border-white/10 hover:bg-white/10";
                return `<button onclick="setCategory('${cat}')" class="snap-start flex-none px-5 py-1.5 rounded-full text-sm transition-all duration-300 ${isActive ? activeStyle : inactiveStyle}">${cat}</button>`;
            }).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            extractCategories();
            applyFilters();
        }

        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const ind = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + ind);
                }
            }
            return matrix[b.length][a.length];
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            applyFilters();
        });

        function applyFilters() {
            let filtered = allRecipes;
            if (activeCategory !== 'Tümü') filtered = filtered.filter(r => r.category === activeCategory);
            if (searchQuery) {
                filtered = filtered.filter(r => {
                    const titleMatch = r.title.toLowerCase().includes(searchQuery);
                    const fuzzyMatch = r.title.toLowerCase().split(' ').some(word => getEditDistance(word, searchQuery) <= 2);
                    return titleMatch || fuzzyMatch;
                });
            }
            renderRecipes(filtered);
        }

        function toggleView() {
            isGridView = !isGridView;
            const container = document.getElementById('recipe-container');
            const icon = document.getElementById('view-icon');
            container.className = isGridView ? 'grid-view pb-20' : 'list-view pb-20';
            icon.className = isGridView ? 'ph ph-squares-four text-gray-300' : 'ph ph-list text-gray-300';
            applyFilters();
        }

        function translateText(text) {
            let translated = text;
            for (const key in dictionary) {
                const regex = new RegExp(key, "g");
                translated = translated.replace(regex, `<span class="font-bold text-white bg-[#00B5E2]/20 border border-[#00B5E2]/30 px-2.5 py-1 rounded-lg inline-flex items-center gap-1.5 shadow-sm mx-1">${icons[key]} ${dictionary[key]}</span>`);
            }
            const speedRegex = /\{\{hiz_([1-9]|10)\}\}/g;
            const fanIcon = "<i class='ph-fill ph-fan beko-text text-lg animate-[spin_2s_linear_infinite]'></i>";
            translated = translated.replace(speedRegex, `<span class="font-bold text-white bg-[#00B5E2]/20 border border-[#00B5E2]/30 px-2.5 py-1 rounded-lg inline-flex items-center gap-1.5 shadow-sm mx-1">${fanIcon} Hız $1</span>`);
            return translated;
        }

        function renderRecipes(recipesToRender) {
            const container = document.getElementById('recipe-container');
            container.innerHTML = '';
            if(recipesToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-12 mt-4 glass-card rounded-3xl p-6 border border-dashed border-gray-600"><i class="ph ph-cooking-pot text-4xl mb-3 opacity-50"></i><br>Şu an bu kategoride aktif tarif bulunamadı.</div>`;
                return;
            }
            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-3xl overflow-hidden cursor-pointer ${!isGridView ? 'flex h-36' : 'flex flex-col'}`;
                card.onclick = () => openRecipe(recipe.id);
                
                const imgClass = isGridView ? 'w-full h-40 object-cover rounded-t-3xl' : 'w-36 h-full object-cover shrink-0 rounded-l-3xl';
                const bodyClass = isGridView ? 'p-4' : 'p-4 flex flex-col justify-center flex-1 min-w-0';

                card.innerHTML = `
                    <img src="${recipe.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?q=80&w=600&auto=format&fit=crop'}" class="${imgClass}">
                    <div class="${bodyClass}">
                        <div class="text-[10px] uppercase tracking-widest beko-text font-bold mb-1.5">${recipe.category}</div>
                        <h3 class="font-bold truncate text-lg text-white mb-2">${recipe.title}</h3>
                        <div class="text-sm text-gray-400 flex items-center gap-2 font-medium">
                            <i class="ph-fill ph-clock text-gray-400"></i> ${recipe.cookTime}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openRecipe(id) {
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            
            document.getElementById('detail-title').innerText = recipe.title;
            document.getElementById('recipe-detail').setAttribute('data-id', id);
            
            let nutritionHtml = '';
            if (recipe.nutrition) {
                nutritionHtml = `
                    <h3 class="text-lg font-bold mb-3 text-white flex items-center gap-2"><i class="ph-fill ph-heart-vital beko-text"></i> Besin Değerleri (1 Porsiyon)</h3>
                    <div class="glass-card rounded-2xl p-4 mb-8 grid grid-cols-2 gap-3 text-center border border-white/5">
                        <div class="p-2 bg-white/5 rounded-xl"><div class="text-gray-400 text-[10px] uppercase mb-1 font-bold">Kalori</div><div class="font-bold text-white text-sm">${recipe.nutrition.kalori || '-'}</div></div>
                        <div class="p-2 bg-white/5 rounded-xl"><div class="text-gray-400 text-[10px] uppercase mb-1 font-bold">Protein</div><div class="font-bold text-white text-sm">${recipe.nutrition.protein || '-'}</div></div>
                        <div class="p-2 bg-white/5 rounded-xl"><div class="text-gray-400 text-[10px] uppercase mb-1 font-bold">Karbonhidrat</div><div class="font-bold text-white text-sm">${recipe.nutrition.karbonhidrat || '-'}</div></div>
                        <div class="p-2 bg-white/5 rounded-xl"><div class="text-gray-400 text-[10px] uppercase mb-1 font-bold">Yağ</div><div class="font-bold text-white text-sm">${recipe.nutrition.yag || '-'}</div></div>
                    </div>
                `;
            }

            let html = `
                <div class="relative mb-6">
                    <img src="${recipe.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?q=80&w=800&auto=format&fit=crop'}" class="w-full h-64 object-cover rounded-3xl shadow-2xl">
                    <div class="absolute bottom-4 right-4 glass-panel px-3.5 py-1.5 rounded-xl text-sm font-bold shadow-lg flex items-center gap-1.5 border border-white/10"><i class="ph-fill ph-users beko-text"></i> ${recipe.portions}</div>
                </div>
                
                <div class="flex gap-3 mb-8">
                    <div class="glass-card rounded-2xl p-4 flex-1 text-center border border-white/5"><div class="text-gray-400 text-[10px] uppercase tracking-widest mb-1.5 font-bold">Hazırlık</div><div class="font-bold text-lg text-white">${recipe.prepTime}</div></div>
                    <div class="glass-card rounded-2xl p-4 flex-1 text-center border border-white/5"><div class="text-gray-400 text-[10px] uppercase tracking-widest mb-1.5 font-bold">Pişirme</div><div class="font-bold text-lg text-white">${recipe.cookTime}</div></div>
                </div>

                ${nutritionHtml}

                <h3 class="text-lg font-bold mb-3 text-white flex items-center gap-2"><i class="ph-fill ph-basket beko-text"></i> Malzemeler</h3>
                <ul class="glass-card rounded-3xl p-5 mb-8 space-y-4 border border-white/5">
                    ${recipe.ingredients.map(ing => `
                        <li class="flex justify-between items-center border-b border-white/5 pb-3 last:border-0 last:pb-0">
                            <span class="text-base text-gray-300 font-medium">${ing.name}</span>
                            <span class="text-white font-bold bg-white/5 px-3 py-1 rounded-lg border border-white/10 shadow-inner">${ing.amount}</span>
                        </li>
                    `).join('')}
                </ul>

                <h3 class="text-lg font-bold mb-3 text-white flex items-center gap-2"><i class="ph-fill ph-cooking-pot beko-text"></i> Hazırlık Adımları</h3>
                <div class="glass-card rounded-3xl p-6 space-y-8 mb-20 border border-white/5">
                    ${recipe.steps.map((step, index) => `
                        <div class="flex gap-4">
                            <div class="w-8 h-8 rounded-full beko-bg flex items-center justify-center text-sm font-extrabold shrink-0 mt-0.5 shadow-[0_4px_10px_rgba(0,181,226,0.3)]">${index + 1}</div>
                            <p class="text-gray-200 text-[17px] leading-relaxed tracking-wide">${translateText(step)}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('detail-content').innerHTML = html;
            document.getElementById('recipe-detail').classList.add('active');
        }

        function closeRecipe() {
            document.getElementById('recipe-detail').classList.remove('active');
        }

        loadRecipes();
    </script>
</body>
</html>
