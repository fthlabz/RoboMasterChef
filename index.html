<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RoboMasterChef</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Premium Koyu Tema - Apple Glassmorphism */
        body { 
            background: radial-gradient(circle at top left, #1a1a24 0%, #0d0d12 100%); 
            color: #f3f4f6; 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        .glass-panel { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s cubic-bezier(0.32, 0.72, 0, 1), background 0.2s ease;
        }
        
        .glass-card:active { transform: scale(0.97); background: rgba(255, 255, 255, 0.06); }

        .neon-text { color: #00E676; }
        .neon-bg { background-color: #00E676; color: #000; box-shadow: 0 4px 15px rgba(0, 230, 118, 0.3); }

        #recipe-detail { 
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); 
            transform: translateX(100%); 
        }
        #recipe-detail.active { transform: translateX(0); }
        
        .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1.25rem; }
        .list-view { display: flex; flex-direction: column; gap: 1.25rem; }
        
        /* Kaydırma Çubuklarını Gizle */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased h-screen overflow-hidden flex flex-col pb-safe">

    <!-- Üst Bar ve Cihaz Menüsü -->
    <header class="glass-panel z-10 flex flex-col pt-12 pb-4 px-5 shrink-0 rounded-b-3xl relative">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                <i class="ph-fill ph-cooking-pot neon-text text-3xl"></i> RoboMasterChef
            </h1>
        </div>
        
        <div class="flex bg-black/40 rounded-2xl p-1.5 border border-white/10 w-full overflow-x-auto hide-scrollbar gap-1 relative snap-x">
            <button id="btn-thermomix" class="snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#00E676]/20 border border-[#00E676]/30 shadow-sm transition-all" onclick="setDevice('thermomix')">Thermomix</button>
            <button id="btn-beko" class="snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white transition-all" onclick="setDevice('beko')">Beko 8491</button>
            <button id="btn-fakir" class="snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white transition-all" onclick="setDevice('fakir')">Fakir</button>
            <button id="btn-arzum" class="snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white transition-all" onclick="setDevice('arzum')">Arzum</button>
        </div>
    </header>

    <!-- Ana Ekran (Arama & Kategoriler & Listeler) -->
    <main id="main-view" class="flex-1 overflow-y-auto p-5 hide-scrollbar relative">
        
        <!-- Arama Çubuğu -->
        <div class="mb-4 flex gap-3 sticky top-0 z-10 pt-2 bg-[#0d0d12]/80 backdrop-blur-md pb-2 -mx-5 px-5">
            <div class="relative flex-1">
                <i class="ph ph-magnifying-glass absolute left-4 top-3.5 text-gray-400 text-xl"></i>
                <input type="text" id="search-input" placeholder="Tarif veya malzeme ara..." class="w-full glass-card rounded-2xl py-3.5 pl-12 pr-4 text-white text-base focus:outline-none focus:border-[#00E676]/50 placeholder-gray-500 transition-colors shadow-lg">
            </div>
            <button onclick="toggleView()" class="glass-card w-14 rounded-2xl flex items-center justify-center text-2xl shadow-lg">
                <i id="view-icon" class="ph ph-squares-four text-gray-300"></i>
            </button>
        </div>

        <!-- DİNAMİK KATEGORİ FİLTRESİ -->
        <div id="category-filter" class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1 snap-x">
            <!-- Kategoriler buraya otomatik gelecek -->
        </div>
        
        <!-- Yükleniyor Göstergesi -->
        <div id="loading-indicator" class="text-center py-10 text-gray-400">
            <i class="ph ph-spinner animate-spin text-3xl neon-text mb-2"></i>
            <p class="text-sm font-medium">Tarifler Yükleniyor...</p>
        </div>

        <!-- Tarif Konteyneri -->
        <div id="recipe-container" class="grid-view pb-20 hidden"></div>
    </main>

    <!-- Tarif Detay Sayfası -->
    <div id="recipe-detail" class="fixed inset-0 bg-[#0d0d12]/95 backdrop-blur-2xl z-50 flex flex-col h-full overflow-hidden">
        <div class="glass-panel pt-12 pb-4 px-4 flex items-center gap-4 shrink-0 rounded-b-3xl">
            <button onclick="closeRecipe()" class="glass-card p-2.5 rounded-full text-2xl"><i class="ph ph-caret-left"></i></button>
            <h2 id="detail-title" class="text-xl font-bold flex-1 truncate tracking-tight">Tarif Adı</h2>
        </div>
        <div class="flex-1 overflow-y-auto p-5 hide-scrollbar" id="detail-content"></div>
    </div>

    <script>
        // OTO-ALGILAMA SİSTEMİ (İleride aklınıza gelebilecek tüm JSON isimleri)
        const possibleCategories = [
            'data/turk_mutfagi.json', 'data/italyan_mutfagi.json', 'data/fransiz_mutfagi.json', 
            'data/asya_mutfagi.json', 'data/meksika_mutfagi.json', 'data/dunya_mutfagi.json', 
            'data/hamur_isleri.json', 'data/tatlilar.json', 'data/icecekler.json', 'data/smoothie.json',
            'data/corbalar.json', 'data/salatalar.json', 'data/et_yemekleri.json', 
            'data/zeytinyaglilar.json', 'data/saglikli_yasam.json', 'data/bebek_mamalari.json', 
            'data/soslar.json', 'data/seflerden_ozel.json', 'data/meze.json',
            'data/deniz_urunleri.json', 'data/vegan_tarifler.json', 'data/glutensiz.json',
            'data/kahvaltilik.json', 'data/pratik_tarifler.json', 'data/kislik_hazirliklar.json'
        ];

        let currentDevice = 'thermomix';
        let isGridView = true;
        let allRecipes = [];
        
        // Yeni Filtre Değişkenleri
        let activeCategory = 'Tümü';
        let searchQuery = '';

        // 4 MARKAYI DESTEKLEYEN SÖZLÜK
        const dictionary = {
            thermomix: { "{{buhar_unitesi}}": "Varoma", "{{ic_sepet}}": "Süzgeç", "{{ters_bicak}}": "Ters Bıçak", "{{kasik_hizi}}": "Kaşık Hızı", "{{cirpici}}": "Kelebek Çırpıcı", "{{sote_bicagi}}": "Bıçak Kılıfı", "{{olcu_kabi}}": "Ölçü Kabı", "{{spatula}}": "Spatula" },
            beko: { "{{buhar_unitesi}}": "Buhar Sepeti", "{{ic_sepet}}": "Pişirme Sepeti", "{{ters_bicak}}": "Ters Dönüş", "{{kasik_hizi}}": "Hız 1", "{{cirpici}}": "Çırpma Aparatı", "{{sote_bicagi}}": "Sote Bıçağı", "{{olcu_kabi}}": "Ölçü Kapağı", "{{spatula}}": "Spatula" },
            fakir: { "{{buhar_unitesi}}": "Buhar Tepsisi", "{{ic_sepet}}": "Haşlama Sepeti", "{{ters_bicak}}": "Ters İşlem", "{{kasik_hizi}}": "Düşük Hız", "{{cirpici}}": "Çırpıcı", "{{sote_bicagi}}": "Bıçak Koruyucu", "{{olcu_kabi}}": "Ölçü Bardağı", "{{spatula}}": "Spatula" },
            arzum: { "{{buhar_unitesi}}": "Buhar Aparatı", "{{ic_sepet}}": "Pişirme Haznesi", "{{ters_bicak}}": "Ters Yön", "{{kasik_hizi}}": "Yavaş Karıştırma", "{{cirpici}}": "Mikser Aparatı", "{{sote_bicagi}}": "Bıçak Kapağı", "{{olcu_kabi}}": "Ölçüm Kabı", "{{spatula}}": "Spatula" }
        };

        const icons = {
            thermomix: { "{{buhar_unitesi}}": "<i class='ph-fill ph-cloud-arrow-up neon-text text-xl'></i>", "{{ic_sepet}}": "<i class='ph-fill ph-basket neon-text text-xl'></i>", "{{ters_bicak}}": "<i class='ph-fill ph-arrows-left-right neon-text text-xl'></i>", "{{kasik_hizi}}": "<i class='ph-fill ph-spoon neon-text text-xl'></i>", "{{cirpici}}": "<i class='ph-fill ph-spiral neon-text text-xl'></i>", "{{sote_bicagi}}": "<i class='ph-fill ph-shield-check neon-text text-xl'></i>", "{{olcu_kabi}}": "<i class='ph-fill ph-brandy neon-text text-xl'></i>", "{{spatula}}": "<i class='ph-fill ph-paint-roller neon-text text-xl'></i>" },
            beko: { "{{buhar_unitesi}}": "<i class='ph-fill ph-cloud-sun neon-text text-xl'></i>", "{{ic_sepet}}": "<i class='ph-fill ph-shopping-cart-simple neon-text text-xl'></i>", "{{ters_bicak}}": "<i class='ph-fill ph-arrow-u-down-left neon-text text-xl'></i>", "{{kasik_hizi}}": "<i class='ph-fill ph-number-circle-one neon-text text-xl'></i>", "{{cirpici}}": "<i class='ph-fill ph-tornado neon-text text-xl'></i>", "{{sote_bicagi}}": "<i class='ph-fill ph-sword neon-text text-xl'></i>", "{{olcu_kabi}}": "<i class='ph-fill ph-brandy neon-text text-xl'></i>", "{{spatula}}": "<i class='ph-fill ph-paint-roller neon-text text-xl'></i>" },
            fakir: { "{{buhar_unitesi}}": "<i class='ph-fill ph-cloud-fog neon-text text-xl'></i>", "{{ic_sepet}}": "<i class='ph-fill ph-tote neon-text text-xl'></i>", "{{ters_bicak}}": "<i class='ph-fill ph-arrows-clockwise neon-text text-xl'></i>", "{{kasik_hizi}}": "<i class='ph-fill ph-wind neon-text text-xl'></i>", "{{cirpici}}": "<i class='ph-fill ph-spinner neon-text text-xl'></i>", "{{sote_bicagi}}": "<i class='ph-fill ph-shield-warning neon-text text-xl'></i>", "{{olcu_kabi}}": "<i class='ph-fill ph-cup neon-text text-xl'></i>", "{{spatula}}": "<i class='ph-fill ph-ruler neon-text text-xl'></i>" },
            arzum: { "{{buhar_unitesi}}": "<i class='ph-fill ph-waves neon-text text-xl'></i>", "{{ic_sepet}}": "<i class='ph-fill ph-bowl-food neon-text text-xl'></i>", "{{ters_bicak}}": "<i class='ph-fill ph-arrow-counter-clockwise neon-text text-xl'></i>", "{{kasik_hizi}}": "<i class='ph-fill ph-leaf neon-text text-xl'></i>", "{{cirpici}}": "<i class='ph-fill ph-intersect neon-text text-xl'></i>", "{{sote_bicagi}}": "<i class='ph-fill ph-lock-key neon-text text-xl'></i>", "{{olcu_kabi}}": "<i class='ph-fill ph-drop neon-text text-xl'></i>", "{{spatula}}": "<i class='ph-fill ph-magic-wand neon-text text-xl'></i>" }
        };

        async function loadRecipes() {
            allRecipes = [];
            const fetchPromises = possibleCategories.map(file => 
                fetch(file).then(res => res.ok ? res.json() : []).catch(() => [])
            );
            
            const results = await Promise.all(fetchPromises);
            results.forEach(data => { if(data.length > 0) allRecipes = allRecipes.concat(data); });
            
            document.getElementById('loading-indicator').classList.add('hidden');
            document.getElementById('recipe-container').classList.remove('hidden');
            
            extractCategories(); // Kategorileri JSON'dan oluştur
            applyFilters();      // Tarifleri Ekrana Bas
        }

        // JSON'DAN KATEGORİLERİ OTOMATİK ÇEKME VE BUTON OLUŞTURMA
        function extractCategories() {
            // allRecipes içindeki benzersiz kategori isimlerini bulur
            const uniqueCategories = ['Tümü', ...new Set(allRecipes.map(r => r.category))];
            const catContainer = document.getElementById('category-filter');
            
            catContainer.innerHTML = uniqueCategories.map(cat => {
                const isActive = cat === activeCategory;
                const activeStyle = "bg-[#00E676] text-black font-bold shadow-[0_0_12px_rgba(0,230,118,0.5)]";
                const inactiveStyle = "bg-white/5 text-gray-300 border border-white/10 hover:bg-white/10";
                
                return `
                    <button onclick="setCategory('${cat}')" 
                            class="snap-start flex-none px-4 py-1.5 rounded-full text-sm transition-all duration-300 ${isActive ? activeStyle : inactiveStyle}">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            extractCategories(); // Buton renklerini güncelle
            applyFilters();      // Tarifleri filtrele
        }

        // AKILLI ARAMA ALGORİTMASI
        function getEditDistance(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array(b.length + 1).fill(null).map(() => Array(a.length + 1).fill(null));
            for (let i = 0; i <= a.length; i++) matrix[0][i] = i;
            for (let j = 0; j <= b.length; j++) matrix[j][0] = j;
            for (let j = 1; j <= b.length; j++) {
                for (let i = 1; i <= a.length; i++) {
                    const ind = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[j][i] = Math.min(matrix[j][i - 1] + 1, matrix[j - 1][i] + 1, matrix[j - 1][i - 1] + ind);
                }
            }
            return matrix[b.length][a.length];
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            applyFilters();
        });

        // FİLTRELEME (Hem Kategori Hem Arama Motorunu Aynı Anda Çalıştırır)
        function applyFilters() {
            let filtered = allRecipes;

            // 1. Kategori Filtresi
            if (activeCategory !== 'Tümü') {
                filtered = filtered.filter(r => r.category === activeCategory);
            }

            // 2. Arama Motoru Filtresi
            if (searchQuery) {
                filtered = filtered.filter(r => {
                    const titleMatch = r.title.toLowerCase().includes(searchQuery);
                    const fuzzyMatch = r.title.toLowerCase().split(' ').some(word => getEditDistance(word, searchQuery) <= 2);
                    return titleMatch || fuzzyMatch;
                });
            }

            renderRecipes(filtered);
        }

        // CİHAZ DEĞİŞTİRİCİ
        function setDevice(device) {
            currentDevice = device;
            const devices = ['thermomix', 'beko', 'fakir', 'arzum'];
            
            devices.forEach(d => {
                const btn = document.getElementById(`btn-${d}`);
                if (d === device) {
                    btn.className = "snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-semibold text-white bg-[#00E676]/20 border border-[#00E676]/30 shadow-sm transition-all";
                } else {
                    btn.className = "snap-start flex-none px-5 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:text-white transition-all";
                }
            });
            
            if(document.getElementById('recipe-detail').classList.contains('active')) {
                const currentId = document.getElementById('recipe-detail').getAttribute('data-id');
                if(currentId) openRecipe(currentId);
            }
        }

        function toggleView() {
            isGridView = !isGridView;
            const container = document.getElementById('recipe-container');
            const icon = document.getElementById('view-icon');
            container.className = isGridView ? 'grid-view pb-20' : 'list-view pb-20';
            icon.className = isGridView ? 'ph ph-squares-four text-gray-300' : 'ph ph-list text-gray-300';
            applyFilters(); // Mevcut filtreyle yeniden çiz
        }

        // AKILLI ÇEVİRİ MOTORU
        function translateText(text) {
            let translated = text;
            const dict = dictionary[currentDevice];
            const iconDict = icons[currentDevice];
            
            for (const key in dict) {
                const regex = new RegExp(key, "g");
                translated = translated.replace(regex, `<span class="font-bold text-white bg-white/10 px-2 py-0.5 rounded-lg inline-flex items-center gap-1.5 shadow-sm mx-1">${iconDict[key]} ${dict[key]}</span>`);
            }
            
            const speedRegex = /\{\{hiz_([1-9]|10)\}\}/g;
            const fanIcon = "<i class='ph-fill ph-fan neon-text text-xl animate-[spin_2s_linear_infinite]'></i>";
            translated = translated.replace(speedRegex, `<span class="font-bold text-white bg-white/10 px-2 py-0.5 rounded-lg inline-flex items-center gap-1.5 shadow-sm mx-1">${fanIcon} Hız $1</span>`);

            return translated;
        }

        function renderRecipes(recipesToRender) {
            const container = document.getElementById('recipe-container');
            container.innerHTML = '';
            
            if(recipesToRender.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10 mt-10 glass-card rounded-3xl p-6">Bu kategori veya aramaya uygun tarif bulunamadı.</div>`;
                return;
            }

            recipesToRender.forEach(recipe => {
                const card = document.createElement('div');
                card.className = `glass-card rounded-3xl overflow-hidden cursor-pointer ${!isGridView ? 'flex h-36' : 'flex flex-col'}`;
                card.onclick = () => openRecipe(recipe.id);
                
                const imgClass = isGridView ? 'w-full h-40 object-cover rounded-t-3xl' : 'w-36 h-full object-cover shrink-0 rounded-l-3xl';
                const bodyClass = isGridView ? 'p-4' : 'p-4 flex flex-col justify-center flex-1 min-w-0';

                card.innerHTML = `
                    <img src="${recipe.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?q=80&w=600&auto=format&fit=crop'}" class="${imgClass}">
                    <div class="${bodyClass}">
                        <div class="text-xs uppercase tracking-wider text-[#00E676] font-bold mb-1.5">${recipe.category}</div>
                        <h3 class="font-bold truncate text-lg text-white mb-2">${recipe.title}</h3>
                        <div class="text-sm text-gray-400 flex items-center gap-2 font-medium">
                            <i class="ph-fill ph-clock text-gray-300"></i> ${recipe.cookTime}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openRecipe(id) {
            const recipe = allRecipes.find(r => r.id === id);
            if (!recipe) return;
            
            document.getElementById('detail-title').innerText = recipe.title;
            document.getElementById('recipe-detail').setAttribute('data-id', id);
            
            let html = `
                <div class="relative mb-6">
                    <img src="${recipe.image || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?q=80&w=800&auto=format&fit=crop'}" class="w-full h-64 object-cover rounded-3xl shadow-2xl">
                    <div class="absolute bottom-4 right-4 glass-panel px-3 py-1.5 rounded-xl text-sm font-bold shadow-lg flex items-center gap-1"><i class="ph-fill ph-users"></i> ${recipe.portions}</div>
                </div>
                
                <div class="flex gap-3 mb-8">
                    <div class="glass-card rounded-2xl p-4 flex-1 text-center shadow-lg"><div class="text-gray-400 text-xs uppercase tracking-wide mb-1.5 font-semibold">Hazırlık</div><div class="font-bold text-lg text-white">${recipe.prepTime}</div></div>
                    <div class="glass-card rounded-2xl p-4 flex-1 text-center shadow-lg"><div class="text-gray-400 text-xs uppercase tracking-wide mb-1.5 font-semibold">Pişirme</div><div class="font-bold text-lg text-white">${recipe.cookTime}</div></div>
                </div>

                <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2"><i class="ph-fill ph-basket neon-text"></i> Malzemeler</h3>
                <ul class="glass-card rounded-3xl p-5 mb-8 space-y-4 shadow-lg">
                    ${recipe.ingredients.map(ing => `
                        <li class="flex justify-between items-center border-b border-white/5 pb-3 last:border-0 last:pb-0">
                            <span class="text-base text-gray-200">${ing.name}</span>
                            <span class="text-white font-bold bg-white/10 px-3 py-1 rounded-lg">${ing.amount}</span>
                        </li>
                    `).join('')}
                </ul>

                <h3 class="text-xl font-bold mb-4 text-white flex items-center gap-2"><i class="ph-fill ph-cooking-pot neon-text"></i> Hazırlık Adımları</h3>
                <div class="glass-card rounded-3xl p-6 space-y-8 mb-20 shadow-lg">
                    ${recipe.steps.map((step, index) => `
                        <div class="flex gap-4">
                            <div class="w-8 h-8 rounded-full neon-bg flex items-center justify-center text-sm font-extrabold shrink-0 mt-1 shadow-md">${index + 1}</div>
                            <p class="text-gray-200 text-lg leading-relaxed">${translateText(step)}</p>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('detail-content').innerHTML = html;
            document.getElementById('recipe-detail').classList.add('active');
        }

        function closeRecipe() {
            document.getElementById('recipe-detail').classList.remove('active');
        }

        // Sistemi Başlat
        loadRecipes();
    </script>
</body>
</html>
